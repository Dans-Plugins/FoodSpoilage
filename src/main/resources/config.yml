version: '3.0.0'
text:
  expiry-date-lore:
  - ''
  - '&fExpiry Date:'
  - '&f${expiry_date}'
  values-loaded: 'Values loaded!'
  no-permission-reload: 'Sorry! In order to use this command, you need the following permission: ''fs.reload'''
  spoiled-food-name: 'Spoiled Food'
  spoiled-food-lore: 'This food has gone bad.'
  never-spoil: 'This item will never spoil.'
  time-left: 'This item will expire in ${time}.'
  less-than-an-hour: 'This item will expire in less than an hour.'
  less-than-a-day: 'This item will expire in less than a day.'
  no-time-left: 'This item has expired.'
  waxed-food-lore:
  - ''
  - '&fWaxed'
  - '&7This item will not spoil but cannot be eaten.'
expiry-date-format: 'MM/dd/yyyy'
spoil-time:
  default: PT24H
  BREAD: PT24H
  POTATO: PT48H
  CARROT: PT48H
  BEETROOT: PT48H
  BEEF: PT24H
  PORKCHOP: PT24H
  CHICKEN: PT24H
  COD: PT24H
  SALMON: PT24H
  MUTTON: PT24H
  RABBIT: PT24H
  TROPICAL_FISH: PT24H
  PUFFERFISH: PT24H
  MUSHROOM_STEW: PT72H
  RABBIT_STEW: PT96H
  BEETROOT_SOUP: PT72H
  COOKED_BEEF: PT72H
  COOKED_PORKCHOP: PT72H
  COOKED_CHICKEN: PT72H
  COOKED_SALMON: PT72H
  COOKED_MUTTON: PT72H
  COOKED_RABBIT: PT72H
  COOKED_COD: PT72H
  WHEAT: PT48H
  HAY_BLOCK: PT48H
  MELON: PT48H
  PUMPKIN: PT48H
  BROWN_MUSHROOM: PT48H
  RED_MUSHROOM: PT48H
  NETHER_WART: PT168H
  MELON_SLICE: PT24H
  CAKE: PT24H
  PUMPKIN_PIE: PT24H
  SUGAR: PT72H
  EGG: PT72H
  SUGAR_CANE: PT48H
  APPLE: PT48H
  COOKIE: PT94H
  POISONOUS_POTATO: PT24H
  CHORUS_FRUIT: PT94H
  DRIED_KELP: PT72H
  BAKED_POTATO: PT94H
  SWEET_BERRIES: PT48H
spoil-chance:
  WHEAT: 0.3
enable-waxing: true
wax-material: HONEYCOMB
# The item food turns into once it spoils. Any obtainable Bukkit material name is accepted; a name
# that cannot be resolved falls back to ROTTEN_FLESH and logs a warning. Whichever material is set
# here is itself never given an expiry date, so spoiled food does not spoil a second time.
spoiled-food-material: ROTTEN_FLESH
# When true, items in the furnace output slot are stamped with an expiry date
# immediately when cooked. This works correctly on older versions of Minecraft,
# but on 1.20.5+ it will cause furnaces to stall after cooking one item.
# When false (the default), items are stamped lazily when they reach a player.
timestamp-furnace-output: false
debug: false

# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version)
# is sent to the author's trace server so it is known which plugins are
# actually in use. Nothing about players or the server is included. Sending
# happens off the main thread, never blocks a tick, and is dropped silently
# if the server cannot be reached. Set enabled to false to turn it off.
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to FoodSpoilage and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. Empty means reporting is off regardless of the switch above.
  key: "3n4mWbsEz0vZ8Pkt9-Zp14fEGWBbGi6-yjXDhtu4xvA"
