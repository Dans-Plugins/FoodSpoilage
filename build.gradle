plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

repositories {
    mavenLocal()
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven { url = uri('https://oss.sonatype.org/content/groups/public/') }
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://repo.maven.apache.org/maven2/') }
    maven { url = uri('https://repo.rpkit.com/repository/maven-releases/') }
}

dependencies {
    implementation 'com.github.Preponderous-Software:ponder:1.1'
    // Provided by the server at runtime, so it is kept off the runtime classpath that
    // shadowJar resolves. Its transitive net.md-5:bungeecord-chat:1.13-SNAPSHOT is no
    // longer downloadable from any configured repository, so it is excluded outright;
    // no source file in this project references the net.md_5.bungee API.
    compileOnly('org.spigotmc:spigot-api:1.14.1-R0.1-SNAPSHOT') {
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }
    implementation 'org.bstats:bstats-bukkit:3.0.0'
    implementation 'com.rpkit:rpk-core-bukkit:2.3.0:all'
    implementation 'com.rpkit:rpk-food-lib-bukkit:2.3.0:all'

    // The Spigot API is compileOnly above, so it is repeated here to put it on the test classpath.
    testImplementation('org.spigotmc:spigot-api:1.14.1-R0.1-SNAPSHOT') {
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Mockito 5 defaults to the inline mock maker, which the plugin's final service classes need.
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
}

group = 'DansPlugins'
version = '3.0.2'
description = 'FoodSpoilage'
java.sourceCompatibility = JavaVersion.VERSION_16

import org.apache.tools.ant.filters.ReplaceTokens
processResources {
    filter ReplaceTokens, tokens: [
            'version': version
    ]
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    dependencies {
        include(dependency('com.github.Preponderous-Software:ponder'))
        include(dependency('org.bstats:bstats-bukkit'))
        include(dependency('org.bstats:bstats-base'))
    }
    // ponder 1.1 is published as a fat jar that carries JUnit 4 and Hamcrest inside it, so the
    // dependency allow-list above cannot filter them out. Nothing in this plugin touches a test
    // framework at runtime, and leaving these unrelocated would put org.junit and org.hamcrest on
    // the shared server classpath alongside every other plugin's.
    exclude 'org/junit/**'
    exclude 'junit/**'
    exclude 'org/hamcrest/**'
    exclude 'LICENSE-junit.txt'
    // ponder's own test class is the sole consumer of the JUnit classes removed above; shipping it
    // without them would leave a class whose references cannot be resolved.
    exclude 'preponderous/ponder/tests/**'
    relocate 'preponderous.ponder', 'spoilagesystem.shadow.preponderous.ponder'
    relocate 'org.intellij', 'spoilagesystem.shadow.org.intellij'
    relocate 'org.jetbrains', 'spoilagesystem.shadow.org.jetbrains'
    relocate 'org.bstats', 'spoilagesystem.shadow.org.bstats'
}

artifacts {
    archives shadowJar
}

publishing {
    publications {
        maven(MavenPublication) { publication ->
            from(project.shadow.component(publication))
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
